services:
  translens:
    build: .
    container_name: translens
    restart: unless-stopped
    ports:
      - "127.0.0.1:7070:8080"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash-preview}
      - JWT_SECRET=${JWT_SECRET}
      - ENABLE_REGISTRATION=${ENABLE_REGISTRATION:-true}
      - PORT=8080
      - DB_PATH=/app/data/translations.db
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}
    volumes:
      - ./data:/app/data
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true
